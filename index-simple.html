<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quién quiere ser un Vendedor SUPER PRO?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        
        .logo {
            max-width: 150px;
            margin: 0 auto 15px auto;
            border: 3px solid #7A1DEA;
            border-radius: 10px;
            padding: 5px;
            background-color: #000;
            box-shadow: 0 0 20px rgba(122, 29, 234, 0.8);
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #FFE600;
            text-align: center;
        }
        
        button {
            background-color: #3483FA;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #7A1DEA;
        }
        
        #game-container {
            display: none;
            margin-top: 20px;
        }
        
        #question-container {
            background-color: #111;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        #question {
            font-size: 18px;
            margin-bottom: 20px;
            color: #FFE600;
        }
        
        .answer {
            background-color: #fff;
            color: #000;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: bold;
        }
        
        .answer-letter {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            background-color: #3483FA;
            color: white;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .answer:hover {
            background-color: #f0f0f0;
        }
        
        #result {
            margin-top: 20px;
            font-size: 18px;
            color: #FFE600;
            font-weight: bold;
        }
        
        #next-button {
            display: none;
            background-color: #7A1DEA;
        }
        
        #timer {
            width: 100%;
            height: 10px;
            background-color: #333;
            margin-bottom: 20px;
            border-radius: 5px;
            overflow: hidden;
        }
        
        #timer-bar {
            height: 100%;
            width: 100%;
            background-color: #3483FA;
            transition: width 1s linear;
        }
        
        #status-container {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: #111;
        }
        
        #status-message {
            margin-bottom: 10px;
        }
        
        #form-container {
            background-color: #111;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #FFE600;
        }
        
        .hide {
            display: none;
        }
        
        .lifelines {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .lifeline {
            width: 40px;
            height: 40px;
            margin: 0 10px;
            background-color: #3483FA;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        
        .lifeline.used {
            background-color: #333;
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="domup_games_logo_violeta_gris.png" alt="DomUp Games Logo" class="logo">
        <h1>¿Quién quiere ser un Vendedor SUPER PRO?</h1>
        
        <div id="status-container">
            <div id="status-message">Verificando conexión a Airtable...</div>
            <div id="status-result"></div>
        </div>
        
        <div id="form-container">
            <h2>Datos del participante</h2>
            <form id="player-form">
                <div>
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" required>
                </div>
                <div>
                    <label for="phone">Teléfono:</label>
                    <input type="tel" id="phone" required pattern="[0-9]{10}">
                </div>
                <button type="submit" id="start-button">¡Comenzar juego!</button>
            </form>
        </div>
        
        <div id="game-container" class="hide">
            <div id="player-info">
                <span id="player-name-display"></span>
                <span id="current-level">Nivel: 1</span>
                <span id="current-prize">Chances: 0</span>
            </div>
            
            <div class="lifelines">
                <div class="lifeline" id="fifty-fifty">50:50</div>
                <div class="lifeline" id="audience">👥</div>
                <div class="lifeline" id="phone">📞</div>
            </div>
            
            <div id="timer">
                <div id="timer-bar"></div>
            </div>
            
            <div id="question-container">
                <div id="question">¿Pregunta de ejemplo?</div>
                <div class="answer" data-index="0">
                    <div class="answer-letter">A</div>
                    <div class="answer-text">Respuesta A</div>
                </div>
                <div class="answer" data-index="1">
                    <div class="answer-letter">B</div>
                    <div class="answer-text">Respuesta B</div>
                </div>
                <div class="answer" data-index="2">
                    <div class="answer-letter">C</div>
                    <div class="answer-text">Respuesta C</div>
                </div>
                <div class="answer" data-index="3">
                    <div class="answer-letter">D</div>
                    <div class="answer-text">Respuesta D</div>
                </div>
            </div>
            
            <div id="result" class="hide"></div>
            <button id="next-button" class="hide">Siguiente pregunta</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Referencias a elementos del DOM
            const statusMessage = document.getElementById('status-message');
            const statusResult = document.getElementById('status-result');
            const playerForm = document.getElementById('player-form');
            const nameInput = document.getElementById('name');
            const phoneInput = document.getElementById('phone');
            const startButton = document.getElementById('start-button');
            const gameContainer = document.getElementById('game-container');
            const formContainer = document.getElementById('form-container');
            const playerNameDisplay = document.getElementById('player-name-display');
            const currentLevel = document.getElementById('current-level');
            const currentPrize = document.getElementById('current-prize');
            const questionElement = document.getElementById('question');
            const answers = document.querySelectorAll('.answer');
            const result = document.getElementById('result');
            const nextButton = document.getElementById('next-button');
            const timerBar = document.getElementById('timer-bar');
            const fiftyFifty = document.getElementById('fifty-fifty');
            const audience = document.getElementById('audience');
            const phone = document.getElementById('phone');
            
            // Estado del juego
            const gameState = {
                player: {
                    name: '',
                    phone: '',
                    level: 1,
                    prize: 0,
                    questionsAnswered: 0
                },
                lifelines: {
                    fiftyFifty: true,
                    audience: true,
                    phone: true
                },
                currentQuestionIndex: 0,
                questions: [],
                timerInterval: null,
                timeLeft: 0
            };
            
            // Niveles de dificultad
            const difficulties = [
                "Fácil 🟢",
                "Menos fácil 🟡",
                "Difícil 🔴",
                "Muy difícil 🔥",
                "Complicada 💀"
            ];
            
            // Pillars (temas)
            const pillars = [
                "Reputación  ❤️",
                "Oferta 💙",
                "Servicio 💛",
                "Tráfico 💜",
                "Data driven 💗"
            ];
            
            // Verificar conexión a Airtable
            checkAirtableConnection();
            
            // Event listeners
            playerForm.addEventListener('submit', startGame);
            nextButton.addEventListener('click', loadNextQuestion);
            answers.forEach(answer => answer.addEventListener('click', checkAnswer));
            fiftyFifty.addEventListener('click', useFiftyFifty);
            audience.addEventListener('click', useAudience);
            phone.addEventListener('click', usePhone);
            
            // Verificar conexión a Airtable
            function checkAirtableConnection() {
                statusMessage.textContent = 'Verificando conexión a Airtable...';
                
                fetch('/api/questions')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Error ${response.status}: ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        statusMessage.textContent = 'Conexión establecida con Airtable';
                        statusResult.textContent = `${data.total || 0} preguntas cargadas`;
                        statusResult.style.color = '#4CAF50';
                        gameState.questions = processQuestions(data);
                        startButton.disabled = false;
                    })
                    .catch(error => {
                        statusMessage.textContent = 'Error de conexión a Airtable';
                        statusResult.textContent = error.message;
                        statusResult.style.color = '#F44336';
                        startButton.disabled = true;
                    });
            }
            
            // Procesar preguntas recibidas
            function processQuestions(data) {
                const questions = [];
                
                // Si tenemos los datos en el formato esperado
                if (data.byDifficultyAndPillar) {
                    for (const difficulty in data.byDifficultyAndPillar) {
                        for (const pillar in data.byDifficultyAndPillar[difficulty]) {
                            const pillarQuestions = data.byDifficultyAndPillar[difficulty][pillar];
                            for (const question of pillarQuestions) {
                                questions.push({
                                    id: question.id,
                                    text: question.text,
                                    options: question.options,
                                    correctIndex: question.correctIndex,
                                    difficulty: difficulty,
                                    pillar: pillar
                                });
                            }
                        }
                    }
                } else if (Array.isArray(data)) {
                    // Si es un array simple de preguntas
                    for (const question of data) {
                        questions.push({
                            id: question.id || Math.random().toString(36).substr(2, 9),
                            text: question.text || question.pregunta || "Pregunta sin texto",
                            options: question.options || question.opciones || ["A", "B", "C", "D"],
                            correctIndex: question.correctIndex || question.respuestaCorrecta || 0,
                            difficulty: question.difficulty || question.dificultad || difficulties[0],
                            pillar: question.pillar || question.pilar || pillars[0]
                        });
                    }
                }
                
                // Si no hay preguntas, crear algunas de ejemplo
                if (questions.length === 0) {
                    for (let i = 0; i < 5; i++) {
                        for (const difficulty of difficulties) {
                            for (const pillar of pillars) {
                                questions.push({
                                    id: `sample-${Math.random().toString(36).substr(2, 9)}`,
                                    text: `¿Pregunta de ejemplo sobre ${pillar} (${difficulty})?`,
                                    options: ["Opción A", "Opción B", "Opción C", "Opción D"],
                                    correctIndex: Math.floor(Math.random() * 4),
                                    difficulty: difficulty,
                                    pillar: pillar
                                });
                            }
                        }
                    }
                }
                
                return questions;
            }
            
            // Iniciar juego
            function startGame(e) {
                e.preventDefault();
                
                // Validar el formulario
                if (!nameInput.value || !phoneInput.value) {
                    alert("Por favor completa todos los campos");
                    return;
                }
                
                // Guardar datos del jugador
                gameState.player.name = nameInput.value;
                gameState.player.phone = phoneInput.value;
                
                // Actualizar UI
                playerNameDisplay.textContent = `Jugador: ${gameState.player.name}`;
                formContainer.classList.add('hide');
                gameContainer.classList.remove('hide');
                
                // Cargar primera pregunta
                loadQuestion();
            }
            
            // Cargar pregunta actual
            function loadQuestion() {
                // Obtener preguntas para el nivel actual
                const levelQuestions = gameState.questions.filter(q => 
                    q.difficulty === difficulties[gameState.player.level - 1]
                );
                
                // Seleccionar una pregunta aleatoria
                const randomIndex = Math.floor(Math.random() * levelQuestions.length);
                const question = levelQuestions[randomIndex] || gameState.questions[0];
                
                gameState.currentQuestion = question;
                
                // Actualizar UI
                questionElement.textContent = question.text;
                answers.forEach((answer, index) => {
                    answer.querySelector('.answer-text').textContent = question.options[index];
                    answer.classList.remove('correct', 'incorrect', 'disabled');
                    answer.style.display = 'flex';
                });
                
                result.classList.add('hide');
                nextButton.classList.add('hide');
                
                // Iniciar temporizador
                startTimer();
            }
            
            // Iniciar temporizador
            function startTimer() {
                // Tiempo según nivel
                const times = [45, 40, 35, 30, 25];
                gameState.timeLeft = times[gameState.player.level - 1] || 30;
                
                // Resetear estado del timer
                clearInterval(gameState.timerInterval);
                timerBar.style.width = '100%';
                timerBar.style.backgroundColor = '#3483FA';
                
                // Iniciar cuenta regresiva
                gameState.timerInterval = setInterval(() => {
                    gameState.timeLeft--;
                    
                    // Actualizar barra de tiempo
                    const percentage = (gameState.timeLeft / times[gameState.player.level - 1]) * 100;
                    timerBar.style.width = `${percentage}%`;
                    
                    // Cambiar color según el tiempo restante
                    if (gameState.timeLeft <= 10) {
                        timerBar.style.backgroundColor = '#F44336';
                    } else if (gameState.timeLeft <= 20) {
                        timerBar.style.backgroundColor = '#FFE600';
                    }
                    
                    // Si se acaba el tiempo
                    if (gameState.timeLeft <= 0) {
                        clearInterval(gameState.timerInterval);
                        timeUp();
                    }
                }, 1000);
            }
            
            // Tiempo agotado
            function timeUp() {
                clearInterval(gameState.timerInterval);
                
                // Mostrar respuesta correcta
                answers.forEach((answer, index) => {
                    if (index === gameState.currentQuestion.correctIndex) {
                        answer.classList.add('correct');
                    }
                    answer.style.pointerEvents = 'none';
                });
                
                result.textContent = "¡Tiempo agotado! Has perdido.";
                result.style.color = "#F44336";
                result.classList.remove('hide');
                
                // Mostrar botón para reiniciar
                nextButton.textContent = "Jugar de nuevo";
                nextButton.onclick = resetGame;
                nextButton.classList.remove('hide');
            }
            
            // Comprobar respuesta
            function checkAnswer() {
                clearInterval(gameState.timerInterval);
                
                const selectedIndex = parseInt(this.dataset.index);
                const isCorrect = selectedIndex === gameState.currentQuestion.correctIndex;
                
                // Mostrar resultado
                if (isCorrect) {
                    this.classList.add('correct');
                    result.textContent = "¡Respuesta correcta!";
                    result.style.color = "#4CAF50";
                    
                    // Actualizar estado del juego
                    gameState.player.questionsAnswered++;
                    
                    // Cada 5 preguntas = 1 chance
                    if (gameState.player.questionsAnswered % 5 === 0) {
                        gameState.player.prize++;
                        result.textContent = `¡Respuesta correcta! ¡Has ganado 1 chance! Total: ${gameState.player.prize}`;
                    }
                    
                    // Si completó todas las preguntas del nivel actual
                    if (gameState.player.questionsAnswered % 5 === 0 && gameState.player.level < 5) {
                        gameState.player.level++;
                        currentLevel.textContent = `Nivel: ${gameState.player.level} - ${difficulties[gameState.player.level - 1]}`;
                    }
                    
                    // Actualizar UI
                    currentPrize.textContent = `Chances: ${gameState.player.prize}`;
                    
                    // Mostrar botón para siguiente pregunta
                    nextButton.textContent = "Siguiente pregunta";
                    nextButton.onclick = loadNextQuestion;
                } else {
                    this.classList.add('incorrect');
                    
                    // Mostrar la respuesta correcta
                    answers[gameState.currentQuestion.correctIndex].classList.add('correct');
                    
                    result.textContent = "Respuesta incorrecta. ¡Has perdido!";
                    result.style.color = "#F44336";
                    
                    // Mostrar botón para reiniciar
                    nextButton.textContent = "Jugar de nuevo";
                    nextButton.onclick = resetGame;
                }
                
                // Deshabilitar todas las respuestas
                answers.forEach(answer => {
                    answer.style.pointerEvents = 'none';
                });
                
                result.classList.remove('hide');
                nextButton.classList.remove('hide');
            }
            
            // Cargar siguiente pregunta
            function loadNextQuestion() {
                nextButton.classList.add('hide');
                loadQuestion();
            }
            
            // Reiniciar juego
            function resetGame() {
                // Reiniciar estado del juego
                gameState.player.level = 1;
                gameState.player.prize = 0;
                gameState.player.questionsAnswered = 0;
                gameState.lifelines = {
                    fiftyFifty: true,
                    audience: true,
                    phone: true
                };
                
                // Reiniciar UI
                currentLevel.textContent = `Nivel: 1`;
                currentPrize.textContent = `Chances: 0`;
                fiftyFifty.classList.remove('used');
                audience.classList.remove('used');
                phone.classList.remove('used');
                
                // Cargar nueva pregunta
                loadQuestion();
            }
            
            // Comodín 50:50
            function useFiftyFifty() {
                if (!gameState.lifelines.fiftyFifty) return;
                
                // Marcar como usado
                gameState.lifelines.fiftyFifty = false;
                fiftyFifty.classList.add('used');
                
                // Determinar opciones a eliminar
                const correctIndex = gameState.currentQuestion.correctIndex;
                const indicesToRemove = [0, 1, 2, 3].filter(i => i !== correctIndex);
                
                // Eliminar aleatoriamente dos opciones incorrectas
                shuffle(indicesToRemove);
                const removeThese = indicesToRemove.slice(0, 2);
                
                // Ocultar las opciones seleccionadas
                removeThese.forEach(index => {
                    answers[index].style.display = 'none';
                });
            }
            
            // Comodín ayuda del público
            function useAudience() {
                if (!gameState.lifelines.audience) return;
                
                // Marcar como usado
                gameState.lifelines.audience = false;
                audience.classList.add('used');
                
                // Generar porcentajes
                const correctIndex = gameState.currentQuestion.correctIndex;
                const percentages = generateAudiencePercentages(correctIndex);
                
                // Mostrar los porcentajes
                let audienceMessage = "El público opina:\n";
                const letters = ['A', 'B', 'C', 'D'];
                
                for (let i = 0; i < 4; i++) {
                    audienceMessage += `${letters[i]}: ${percentages[i]}%\n`;
                }
                
                alert(audienceMessage);
            }
            
            // Generar porcentajes para la ayuda del público
            function generateAudiencePercentages(correctIndex) {
                const percentages = [0, 0, 0, 0];
                
                // Dar mayor porcentaje a la respuesta correcta (entre 40% y 65%)
                percentages[correctIndex] = Math.floor(Math.random() * 25) + 40;
                
                // Repartir el resto entre las demás opciones
                const remaining = 100 - percentages[correctIndex];
                let allocated = 0;
                
                for (let i = 0; i < 4; i++) {
                    if (i !== correctIndex) {
                        if (i === 3 || i === percentages.length - 1) {
                            // La última opción recibe lo que queda
                            percentages[i] = remaining - allocated;
                        } else {
                            // Las demás reciben una parte aleatoria de lo que queda
                            const max = Math.floor((remaining - allocated) / (3 - i));
                            percentages[i] = Math.floor(Math.random() * max);
                            allocated += percentages[i];
                        }
                    }
                }
                
                return percentages;
            }
            
            // Comodín llamada a un experto
            function usePhone() {
                if (!gameState.lifelines.phone) return;
                
                // Marcar como usado
                gameState.lifelines.phone = false;
                phone.classList.add('used');
                
                // Generar consejo del experto
                const correctIndex = gameState.currentQuestion.correctIndex;
                const letters = ['A', 'B', 'C', 'D'];
                
                // 80% de probabilidad de que el experto acierte
                const expertIsCorrect = Math.random() < 0.8;
                
                let expertAnswer;
                if (expertIsCorrect) {
                    expertAnswer = letters[correctIndex];
                } else {
                    // Seleccionar una respuesta incorrecta aleatoria
                    const incorrectOptions = letters.filter((_, i) => i !== correctIndex);
                    expertAnswer = incorrectOptions[Math.floor(Math.random() * incorrectOptions.length)];
                }
                
                let confidence;
                if (expertIsCorrect) {
                    confidence = ["estoy bastante seguro", "estoy casi completamente seguro", "tengo mucha confianza"];
                } else {
                    confidence = ["no estoy 100% seguro", "podría equivocarme", "es mi mejor suposición"];
                }
                
                const confidencePhrase = confidence[Math.floor(Math.random() * confidence.length)];
                
                alert(`El experto dice: "Creo que la respuesta es ${expertAnswer}, ${confidencePhrase}."`);
            }
            
            // Función para mezclar un array (algoritmo Fisher-Yates)
            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
        });
    </script>
</body>
</html>
